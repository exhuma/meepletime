# .pre-commit-config.yaml
#
# Hooks run on every commit. Install once with:
#   pre-commit install          (done automatically by init.bash)
#
# Run manually against all files:
#   pre-commit run --all-files
#
# Python formatting uses ruff configured in backend/pyproject.toml.
# JS/TS/Vue formatting uses prettier configured in
# frontend/.prettierrc.json.
# Both tools are also used by VS Code on save (see
# .devcontainer/devcontainer.json) so formatting is always
# consistent.

repos:
  # ------------------------------------------------------------------
  # Ruff — Python linter + formatter (replaces black + flake8 + isort)
  # Config: backend/pyproject.toml [tool.ruff]
  # ------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.2
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # ------------------------------------------------------------------
  # Prettier — JS / TS / Vue / JSON / YAML / Markdown formatter
  # Config: frontend/.prettierrc.json
  # ------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@3.5.3
        files: ^frontend/
