name: Build and publish images

# Builds the backend and frontend Docker images and pushes them to the
# private container registry on calendar-version tags
# (e.g. v2026.6.15, v2026.6.15-alpha.1).
# Each build publishes the immutable full version (e.g.
# 2026.6.15-alpha.1) plus one or more moving release-channel pointers.
# Channels cascade by maturity (alpha < beta < stable): a stable
# release also advances "beta" and "alpha", a beta release advances
# "alpha", and an alpha release moves only "alpha". No unconditional
# "latest" is pushed.
# Trigger a manual run via the Actions tab with workflow_dispatch.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.component }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
          - component: frontend
            context: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version files match the release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Guard against drift: the pushed tag must match the version
          # baked into the package manifests. The frontend keeps the
          # semver form verbatim; the backend keeps the equivalent
          # PEP440 canonical form (alpha. -> a, beta. -> b, rc. -> rc).
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./frontend/package.json').version")"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::frontend/package.json ($pkg) != tag ($tag)"
            exit 1
          fi
          pep="$(printf '%s' "$tag" \
            | sed -E 's/-alpha\./a/; s/-beta\./b/; s/-rc\./rc/')"
          py="$(python3 -c "import tomllib; print(tomllib.load(open('backend/pyproject.toml','rb'))['project']['version'])")"
          if [ "$py" != "$pep" ]; then
            echo "::error::backend/pyproject.toml ($py) != expected ($pep)"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve registry coordinates
        id: registry
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
        run: |
          # Strip the URL scheme and any trailing slash to get the
          # "<host>/<project>" prefix used when tagging images, and
          # isolate the bare host used to authenticate.
          registry="${DOCKER_REGISTRY#https://}"
          registry="${registry#http://}"
          registry="${registry%/}"
          echo "path=${registry}" >> "$GITHUB_OUTPUT"
          echo "host=${registry%%/*}" >> "$GITHUB_OUTPUT"

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Derive release channels
        id: channel
        run: |
          # Map the pre-release identifier in the tag to the moving
          # channel pointers this build advances. Channels cascade by
          # maturity (alpha < beta < stable), so a more mature release
          # also moves the less mature pointers. A tag with no
          # pre-release is "stable". Calver (YYYY.M.D) carries no semver
          # compatibility meaning, so these per-component pointers
          # replace the {{major}}.{{minor}} / latest tags this project
          # dropped.
          ref="${GITHUB_REF_NAME#v}"
          case "$ref" in
            *-alpha.*) channels="alpha" ;;
            *-beta.*)  channels="beta alpha" ;;
            *-rc.*)    channels="rc" ;;
            *)         channels="stable beta alpha" ;;
          esac
          {
            echo "raw_tags<<EOF"
            for c in $channels; do
              echo "type=raw,value=$c"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registry.outputs.path }}/${{ matrix.component }}
          # No auto-"latest": calver has no semver ordering to anchor it
          # to. The moving pointer is the channel tag below.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            ${{ steps.channel.outputs.raw_tags }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version || '0.0.0+dev' }}
            VITE_GITHUB_REPO_URL=https://github.com/${{ github.repository }}
