version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meepletime
      POSTGRES_USER: meepletime
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meepletime"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-changeme}
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          curl -sf
          http://localhost:8080/realms/master/.well-known/openid-configuration
          > /dev/null
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: >-
        postgresql://meepletime:${DB_PASSWORD:-changeme}@db:5432/meepletime
      OIDC_AUTHORITY: >-
        ${OIDC_AUTHORITY:-http://keycloak:8080/realms/meepletime}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-meepletime-frontend}
      OIDC_ISSUER: >-
        ${OIDC_ISSUER:-http://keycloak:8080/realms/meepletime}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -sf http://localhost:8000/health > /dev/null"
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -sf http://localhost/ > /dev/null"
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
