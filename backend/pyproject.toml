[project]
name = "meepletime-backend"
# Calendar version in PEP440 canonical form. The equivalent semver
# form (2026.6.15-alpha.1) lives in frontend/package.json and in the
# release git tag; CI fails the build if these drift apart.
version = "2026.6.15a3"
description = "MeepleTime backend API"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "sqlalchemy>=2.0.31",
    "alembic>=1.13.2",
    "psycopg[binary]>=3.1",
    "PyJWT[crypto]>=2.12.0",
    "python-multipart>=0.0.22",
    "pydantic[email]>=2.8.2",
    "pydantic-settings>=2.3.4",
    "pytz>=2024.1",
    "apscheduler>=3.10.4",
    "gouge>=2.2.5",
    "httpx>=0.27.0",
    "limits>=3.13.0",
    "pywebpush>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
]

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
# Targets must match the Python version in pyproject.toml.
target-version = "py312"
line-length = 80

[tool.ruff.lint]
# E/W — pycodestyle, F — pyflakes, I — isort, UP — pyupgrade
select = ["E", "W", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy 2 ORM uses string-quoted forward references inside
# Mapped[] annotations (e.g. Mapped["Circle"]).  Ruff's F821
# cannot see that these are resolved by SQLAlchemy at runtime.
"src/app/models/*.py" = ["F821"]

[tool.ruff.format]
# Black-compatible formatting — double quotes, trailing commas.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
