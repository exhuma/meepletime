# https://taskfile.dev
version: "3"

tasks:

  migrate:
    desc: Run database migrations
    dir: backend
    cmd: uv run alembic upgrade head

  brand:sync:
    desc: >-
      Export design/meepletime-brand.json into generated CSS
      and TypeScript token files consumed by both the frontend
      and the Keycloak login theme
    cmd: node scripts/export-brand-tokens.mjs

  backend:
    desc: Start the FastAPI dev server with hot-reload
    dir: backend
    deps: [migrate]
    cmd: >-
      uv run uvicorn app.main:app --reload --host 0.0.0.0
      --log-config logging.dev.yaml

  frontend:
    desc: Start the Vite dev server (re-syncs brand tokens first)
    dir: frontend
    deps: [brand:sync]
    cmd: npm run dev -- --host 0.0.0.0

  build:frontend:
    desc: >-
      Production build of the frontend
      (re-syncs brand tokens first)
    dir: frontend
    deps: [brand:sync]
    cmd: npm run build

  dev:token:
    desc: >-
      Mint a self-signed HS256 dev JWT for headless API testing.
      Requires DEV_SHARED_SECRET in backend/.env.
      Usage: task dev:token [-- --sub agent --email a@dev.local]
    dir: backend
    cmd: uv run python scripts/dev_token.py {{.CLI_ARGS}}

  test:backend:
    desc: Run the backend test suite
    dir: backend
    cmd: uv run pytest {{.CLI_ARGS}}
